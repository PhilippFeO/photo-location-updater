name: Manual Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (ignored if version is set)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Optional explicit version (x.y.z), e.g. 1.6.0"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bump app version
        id: bump_version
        env:
          BUMP: ${{ github.event.inputs.bump }}
          CUSTOM_VERSION: ${{ github.event.inputs.version }}
        shell: pwsh
        run: |
          @'
          import os
          import pathlib
          import re
          import sys

          version_file = pathlib.Path("version.py")
          text = version_file.read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text)
          if not match:
              raise SystemExit("Could not find __version__ in version.py")

          major, minor, patch = map(int, match.groups())

          custom_version = os.getenv("CUSTOM_VERSION", "").strip()
          bump = os.getenv("BUMP", "patch").strip().lower()

          if custom_version:
              if not re.fullmatch(r"\d+\.\d+\.\d+", custom_version):
                  raise SystemExit("Input 'version' must match x.y.z")
              new_version = custom_version
          else:
              if bump == "major":
                  major += 1
                  minor = 0
                  patch = 0
              elif bump == "minor":
                  minor += 1
                  patch = 0
              elif bump == "patch":
                  patch += 1
              else:
                  raise SystemExit(f"Unsupported bump type: {bump}")
              new_version = f"{major}.{minor}.{patch}"

          version_file.write_text(f'__version__ = "{new_version}"\n', encoding="utf-8")
          print(new_version)
          '@ | python | Tee-Object -Variable NEW_VERSION

          "version=$NEW_VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Commit version update
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.py
          if (git diff --cached --quiet) {
            Write-Host "No version change to commit"
          } else {
            git commit -m "chore: release v${{ steps.bump_version.outputs.version }}"
            git push
          }

      - name: Create and push tag
        shell: pwsh
        run: |
          $tag = "v${{ steps.bump_version.outputs.version }}"
          git tag $tag
          git push origin $tag

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "Photo Location Updater" --add-data "map.html;." --add-data "src;src" --add-data "exiftool-13.58_64;exiftool-13.58_64" --collect-all PyQt6 --collect-all PyQt6-WebEngine main.py

      - name: Package release artifact
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.bump_version.outputs.version }}"
          $artifact = "Photo-Location-Updater-v$version-win64.zip"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path "dist/Photo Location Updater/*" -DestinationPath "release/$artifact" -Force
          "artifact=release/$artifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump_version.outputs.version }}
          name: Photo Location Updater v${{ steps.bump_version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.artifact }}
