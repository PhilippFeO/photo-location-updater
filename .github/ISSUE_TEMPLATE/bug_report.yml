name: Bug report
description: Report a problem with Photo Location Updater
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the fields below with as much detail as you can.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the issue.
      placeholder: The map does not load after selecting a folder
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the problem.
      placeholder: |
        1. Open the app
        2. Select a photo folder
        3. Click the map
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, logs, sample file details, or any other context that might help.
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where are you running the app?
      options:
        - Windows
        - macOS
        - Linux
        - Other
  - type: input
    id: python
    attributes:
      label: Python version
      description: If you are running from source, share the Python version.
      placeholder: 3.12.0